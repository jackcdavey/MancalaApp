<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="clay" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#D4855C"/>
      <stop offset="0.45" stop-color="#B96A44"/>
      <stop offset="1" stop-color="#8E4B2C"/>
    </linearGradient>
    <radialGradient id="daylight" cx="0.26" cy="0.14" r="0.72">
      <stop offset="0" stop-color="#FFE7CE" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFE7CE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#clay)"/>
  <rect width="1024" height="1024" fill="url(#daylight)"/>

  <!-- Unglazed clay is porous, not smooth: a fine speckle keeps it from
