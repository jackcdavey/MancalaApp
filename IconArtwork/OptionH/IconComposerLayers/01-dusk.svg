<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="dusk" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#2A3566"/>
      <stop offset="0.42" stop-color="#1A1F44"/>
      <stop offset="1" stop-color="#0B0C1C"/>
    </linearGradient>
    <!-- Nightfall's one slow travelling glow, parked where it flatters the slab -->
    <radialGradient id="travelling" cx="0.72" cy="0.16" r="0.66">
      <stop offset="0" stop-color="#8FA6E8" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#5C6FB4" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#5C6FB4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#dusk)"/>
  <rect width="1024" height="1024" fill="url(#travelling)"/>
</svg>
