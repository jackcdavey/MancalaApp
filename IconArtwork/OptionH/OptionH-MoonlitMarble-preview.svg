<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <g>

  <defs>
    <linearGradient id="L0_dusk" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#2A3566"/>
      <stop offset="0.42" stop-color="#1A1F44"/>
      <stop offset="1" stop-color="#0B0C1C"/>
    </linearGradient>
    <!-- Nightfall's one slow travelling glow, parked where it flatters the slab -->
    <radialGradient id="L0_travelling" cx="0.72" cy="0.16" r="0.66">
      <stop offset="0" stop-color="#8FA6E8" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#5C6FB4" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#5C6FB4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#L0_dusk)"/>
  <rect width="1024" height="1024" fill="url(#L0_travelling)"/>

  </g>
  <g>

  <defs>
    <linearGradient id="L1_marble" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#F2F0EE"/>
      <stop offset="0.5" stop-color="#DCDADC"/>
      <stop offset="1" stop-color="#BEBCC2"/>
    </linearGradient>
    <linearGradient id="L1_slabEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8F8D96"/>
      <stop offset="1" stop-color="#5C5A66"/>
    </linearGradient>
    <clipPath id="L1_slabClip">
      <rect x="40" y="292" width="944" height="440" rx="220"/>
    </clipPath>
  </defs>

  <!-- Slab thickness, so the board sits in the dusk rather than being pasted on -->
  <rect x="40" y="314" width="944" height="440" rx="220" fill="url(#L1_slabEdge)"/>
  <rect x="40" y="292" width="944" height="440" rx="220" fill="url(#L1_marble)"/>

  <!-- Drifting veins -->
  <g clip-path="url(#L1_slabClip)" fill="none" stroke-linecap="round">
    <path d="M40 372 C 220 342, 380 424, 560 386 S 880 410, 984 368"
          stroke="#8E8B98" stroke-opacity="0.42" stroke-width="6"/>
    <path d="M40 396 C 240 372, 400 442, 580 408 S 890 430, 984 396"
          stroke="#8E8B98" stroke-opacity="0.2" stroke-width="3"/>
    <path d="M40 528 C 260 500, 420 566, 620 528 S 900 548, 984 512"
          stroke="#7C7A88" stroke-opacity="0.36" stroke-width="7"/>
    <path d="M40 646 C 200 620, 420 690, 640 650 S 900 668, 984 640"
          stroke="#8E8B98" stroke-opacity="0.4" stroke-width="5"/>
    <path d="M40 676 C 240 654, 440 714, 660 678 S 910 694, 984 672"
          stroke="#8E8B98" stroke-opacity="0.18" stroke-width="3"/>
  </g>

  <!-- Cool moonlight on the chamfer -->
  <rect x="40" y="292" width="944" height="440" rx="220"
        fill="none" stroke="#F6F7FF" stroke-opacity="0.5" stroke-width="7"/>

  </g>
  <g>

  <defs>
    <radialGradient id="L2_hollow" cx="0.36" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#94929C"/>
      <stop offset="0.5" stop-color="#B3B1B9"/>
      <stop offset="1" stop-color="#E2E0E4"/>
    </radialGradient>
    <linearGradient id="L2_rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4E4C58" stop-opacity="0.6"/>
      <stop offset="0.45" stop-color="#4E4C58" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <g fill="url(#L2_hollow)" stroke="url(#L2_rim)" stroke-width="9">
    <rect x="96" y="356" width="116" height="312" rx="58"/>
    <rect x="812" y="356" width="116" height="312" rx="58"/>
    <circle cx="326" cy="412" r="62"/>
    <circle cx="512" cy="412" r="62"/>
    <circle cx="698" cy="412" r="62"/>
    <circle cx="326" cy="612" r="62"/>
    <circle cx="512" cy="612" r="62"/>
    <circle cx="698" cy="612" r="62"/>
  </g>

  </g>
  <g>

  <defs>
    <!-- Night Sky set: deep jewel tones under a wet polish. Roughness 0.04 and
         clearcoat 1.0 in the app, so the speculars are small, hard and bright. -->
    <radialGradient id="L3_nBlue" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#4A5AA8"/><stop offset="0.55" stop-color="#29336B"/><stop offset="1" stop-color="#111634"/>
    </radialGradient>
    <radialGradient id="L3_nViolet" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#8248A6"/><stop offset="0.55" stop-color="#52296B"/><stop offset="1" stop-color="#271133"/>
    </radialGradient>
    <radialGradient id="L3_nTeal" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#2E7B92"/><stop offset="0.55" stop-color="#1A4757"/><stop offset="1" stop-color="#0A2028"/>
    </radialGradient>
    <radialGradient id="L3_nWine" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#A9497A"/><stop offset="0.55" stop-color="#6B2E4D"/><stop offset="1" stop-color="#331424"/>
    </radialGradient>
    <radialGradient id="L3_nInk" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#3A4266"/><stop offset="0.55" stop-color="#1F243D"/><stop offset="1" stop-color="#0B0D18"/>
    </radialGradient>
    <radialGradient id="L3_spec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="L3_contact" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.3" stop-color="#3B3948" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#3B3948" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g fill="url(#L3_contact)">
    <ellipse cx="154" cy="428" rx="42" ry="27"/><ellipse cx="154" cy="512" rx="42" ry="27"/>
    <ellipse cx="154" cy="596" rx="42" ry="27"/>
    <ellipse cx="870" cy="410" rx="42" ry="27"/><ellipse cx="870" cy="494" rx="42" ry="27"/>
    <ellipse cx="870" cy="578" rx="42" ry="27"/><ellipse cx="870" cy="656" rx="42" ry="27"/>
    <ellipse cx="512" cy="424" rx="38" ry="25"/>
    <ellipse cx="682" cy="396" rx="34" ry="22"/><ellipse cx="716" cy="426" rx="34" ry="22"/>
    <ellipse cx="326" cy="624" rx="38" ry="25"/>
    <ellipse cx="496" cy="600" rx="34" ry="22"/><ellipse cx="530" cy="628" rx="34" ry="22"/>
  </g>

  <!-- Left store -->
  <circle cx="154" cy="414" r="36" fill="url(#L3_nViolet)"/><circle cx="142" cy="402" r="11" fill="url(#L3_spec)"/>
  <circle cx="154" cy="498" r="36" fill="url(#L3_nTeal)"/><circle cx="142" cy="486" r="11" fill="url(#L3_spec)"/>
  <circle cx="154" cy="582" r="36" fill="url(#L3_nInk)"/><circle cx="142" cy="570" r="11" fill="url(#L3_spec)"/>

  <!-- Right store, one ahead -->
  <circle cx="870" cy="396" r="36" fill="url(#L3_nWine)"/><circle cx="858" cy="384" r="11" fill="url(#L3_spec)"/>
  <circle cx="870" cy="480" r="36" fill="url(#L3_nBlue)"/><circle cx="858" cy="468" r="11" fill="url(#L3_spec)"/>
  <circle cx="870" cy="564" r="36" fill="url(#L3_nViolet)"/><circle cx="858" cy="552" r="11" fill="url(#L3_spec)"/>
  <circle cx="870" cy="642" r="34" fill="url(#L3_nTeal)"/><circle cx="859" cy="631" r="10" fill="url(#L3_spec)"/>

  <!-- Pits -->
  <circle cx="512" cy="410" r="36" fill="url(#L3_nWine)"/><circle cx="500" cy="398" r="11" fill="url(#L3_spec)"/>

  <circle cx="682" cy="384" r="32" fill="url(#L3_nBlue)"/><circle cx="671" cy="373" r="10" fill="url(#L3_spec)"/>
  <circle cx="716" cy="414" r="32" fill="url(#L3_nViolet)"/><circle cx="705" cy="403" r="10" fill="url(#L3_spec)"/>

  <circle cx="326" cy="610" r="36" fill="url(#L3_nTeal)"/><circle cx="314" cy="598" r="11" fill="url(#L3_spec)"/>

  <circle cx="496" cy="588" r="32" fill="url(#L3_nInk)"/><circle cx="485" cy="577" r="10" fill="url(#L3_spec)"/>
  <circle cx="530" cy="616" r="32" fill="url(#L3_nWine)"/><circle cx="519" cy="605" r="10" fill="url(#L3_spec)"/>

  </g>
  <g>

  <defs>
    <linearGradient id="L4_sheen" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#DDE6FF" stop-opacity="0.2"/>
      <stop offset="0.4" stop-color="#DDE6FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="L4_vignette" cx="0.5" cy="0.48" r="0.74">
      <stop offset="0.5" stop-color="#04050E" stop-opacity="0"/>
      <stop offset="1" stop-color="#04050E" stop-opacity="0.45"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#L4_sheen)"/>
  <rect width="1024" height="1024" fill="url(#L4_vignette)"/>

  </g>
</svg>
