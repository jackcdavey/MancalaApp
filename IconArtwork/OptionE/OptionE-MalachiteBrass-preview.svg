<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <g>

  <defs>
    <linearGradient id="L0_stone" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#125B3E"/>
      <stop offset="0.5" stop-color="#0B3E2B"/>
      <stop offset="1" stop-color="#052018"/>
    </linearGradient>
    <clipPath id="L0_frameClip">
      <rect width="1024" height="1024"/>
    </clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#L0_stone)"/>

  <!-- Malachite banding: concentric growth rings, off-centre -->
  <g clip-path="url(#L0_frameClip)" fill="none" stroke-linecap="round">
    <ellipse cx="248" cy="812" rx="180" ry="150" stroke="#1B7A54" stroke-opacity="0.4" stroke-width="26"/>
    <ellipse cx="248" cy="812" rx="238" ry="200" stroke="#083626" stroke-opacity="0.5" stroke-width="14"/>
    <ellipse cx="248" cy="812" rx="300" ry="256" stroke="#1F8A5F" stroke-opacity="0.3" stroke-width="30"/>
    <ellipse cx="248" cy="812" rx="372" ry="318" stroke="#062B1F" stroke-opacity="0.45" stroke-width="18"/>
    <ellipse cx="248" cy="812" rx="452" ry="388" stroke="#1B7A54" stroke-opacity="0.24" stroke-width="34"/>
    <ellipse cx="248" cy="812" rx="546" ry="470" stroke="#062B1F" stroke-opacity="0.4" stroke-width="20"/>
    <ellipse cx="248" cy="812" rx="652" ry="560" stroke="#1F8A5F" stroke-opacity="0.2" stroke-width="38"/>
    <ellipse cx="248" cy="812" rx="770" ry="660" stroke="#062B1F" stroke-opacity="0.35" stroke-width="22"/>
    <ellipse cx="248" cy="812" rx="900" ry="770" stroke="#1B7A54" stroke-opacity="0.18" stroke-width="40"/>
  </g>

  </g>
  <g>

  <defs>
    <linearGradient id="L1_brass" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#F6E3AE"/>
      <stop offset="0.38" stop-color="#D3AC59"/>
      <stop offset="0.72" stop-color="#A87C2C"/>
      <stop offset="1" stop-color="#E4C983"/>
    </linearGradient>
  </defs>

  <!-- Six pits a side and two stores: the real board, not a shorthand for it.
       A mark that miscounts is making a false claim about the game. -->
  <g id="L1_plate">
    <rect x="148" y="362" width="104" height="300" rx="52"/>
    <rect x="772" y="362" width="104" height="300" rx="52"/>
    <circle cx="295" cy="424" r="38"/><circle cx="382" cy="424" r="38"/>
    <circle cx="469" cy="424" r="38"/><circle cx="555" cy="424" r="38"/>
    <circle cx="642" cy="424" r="38"/><circle cx="729" cy="424" r="38"/>
    <circle cx="295" cy="600" r="38"/><circle cx="382" cy="600" r="38"/>
    <circle cx="469" cy="600" r="38"/><circle cx="555" cy="600" r="38"/>
    <circle cx="642" cy="600" r="38"/><circle cx="729" cy="600" r="38"/>
  </g>

  <!-- Engraved shadow, one notch down and right -->
  <use href="#plate" fill="#03150F" fill-opacity="0.55" transform="translate(6 8)"/>
  <use href="#plate" fill="url(#L1_brass)"/>

  </g>
  <g>

  <defs>
    <linearGradient id="L2_sheen" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#EAFFF4" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#EAFFF4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="L2_vignette" cx="0.5" cy="0.48" r="0.74">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.38"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#L2_sheen)"/>
  <rect width="1024" height="1024" fill="url(#L2_vignette)"/>

  </g>
</svg>
